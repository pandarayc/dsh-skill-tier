# 配合 --patch 使用（先用 dsh plugin add 装上包）：
#   dsh --profile headless --patch examples/lark.yml "只回复 OK"
#
# 还没装包时，把下面 name 里的包名换成你的 clone 路径：
#   sed "s|'@pandarayc/dsh-skill-tier'|'$PWD/lib/index.js'|" examples/lark.yml > /tmp/lark.local.yml
#
# 也可以只把下面的 config 部分写进 profile 的 cordis.patch.yml 长期生效。
- insert:
    - id: skill-tier
      name: '@pandarayc/dsh-skill-tier'
      config:
        groups:
          - name: lark
            title: 飞书/Lark 全能力入口
            description: >-
              飞书/Lark 全能力入口（28 个子技能）：云文档、电子表格、多维表格 Base、云空间、
              消息与群聊、日历、会议与妙记、任务、审批、考勤、OKR、通讯录、知识库、画板、
              幻灯片、邮箱、实时事件订阅、妙搭应用。用户提到飞书/Feishu/Lark 或上述任一能力时
              先加载本技能，再按索引取用子技能全文；不要凭记忆直接调 lark-cli。
            dir: "~/.dsh/lark-skills"
            members: "lark-*"
            detailHint: "lark-cli skills read <成员名>"
            rules:
              - "**先读 `lark-shared`**：身份切换（`--as user/bot`）、权限报错处理、JSON 输出契约、高风险操作确认都在那里。任何飞书操作前都要读。"
              - "**一次只读你真正需要的那 1–2 个子技能**，读完再动手，不要一次全读。"
              - "子技能正文由 `lark-cli` 二进制自带，与已装版本严格一致；**不要凭记忆猜参数或 scope**。"
              - "命令 `--help` 里标 `high-risk-write` 的操作，必须先向用户确认，再加 `--yes`。"
